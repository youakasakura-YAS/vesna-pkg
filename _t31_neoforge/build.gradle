plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.95'
}
version = "1.3.0"
group = "com.example.vesnamc"
base { archivesName = "vesnamc" }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
repositories { mavenCentral() }
dependencies {
    implementation "net.neoforged:neoforge:1.20.1-47.1.106"
}
neoForge {
    runs {
        client {}
        server {}
    }
}
